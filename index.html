<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Disable pinch/double-tap zoom so stray taps at the table don't zoom the page -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Dice Scorekeeper</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <!-- iPhone: run full-screen when added to the home screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Dice Score">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== Setup screen ===== -->
  <section id="setup" class="screen">
    <h1>Dice Scorekeeper</h1>

    <label class="field-label">Players</label>
    <div class="stepper">
      <button type="button" id="players-minus" aria-label="Fewer players">−</button>
      <span id="player-count">2</span>
      <button type="button" id="players-plus" aria-label="More players">+</button>
    </div>

    <div id="name-fields"></div>

    <label class="field-label">Winning score</label>
    <div class="target-options">
      <button type="button" class="target-btn" data-target="5000">5,000</button>
      <button type="button" class="target-btn" data-target="10000">10,000</button>
      <input type="number" id="custom-target" inputmode="numeric" placeholder="Other" min="1">
    </div>

    <button type="button" id="start-btn" class="big-btn primary">Start game</button>
    <button type="button" id="past-btn" class="big-btn muted-btn">Past games</button>
  </section>

  <!-- ===== Game screen ===== -->
  <section id="game" class="screen hidden">
    <header class="game-header">
      <button type="button" id="undo-btn" class="small-btn">↶ Undo</button>
      <div class="header-info">
        <span id="round-label">Round 1</span>
        <span id="target-label">to 10,000</span>
      </div>
      <button type="button" id="table-btn" class="small-btn">Table</button>
    </header>

    <div id="banner" class="banner hidden"></div>

    <ul id="scoreboard"></ul>

    <div class="entry">
      <div id="turn-label"></div>
      <div id="pending">0</div>
    </div>

    <div class="quick-add">
      <button type="button" data-add="50">+50</button>
      <button type="button" data-add="100">+100</button>
      <button type="button" data-add="1000">+1,000</button>
    </div>

    <div class="numpad">
      <button type="button" data-digit="1">1</button>
      <button type="button" data-digit="2">2</button>
      <button type="button" data-digit="3">3</button>
      <button type="button" data-digit="4">4</button>
      <button type="button" data-digit="5">5</button>
      <button type="button" data-digit="6">6</button>
      <button type="button" data-digit="7">7</button>
      <button type="button" data-digit="8">8</button>
      <button type="button" data-digit="9">9</button>
      <button type="button" id="clear-btn" class="muted">Clear</button>
      <button type="button" data-digit="0">0</button>
      <button type="button" id="back-btn" class="muted" aria-label="Backspace">⌫</button>
    </div>

    <div class="actions">
      <button type="button" id="bust-btn" class="big-btn danger">Bust</button>
      <button type="button" id="confirm-btn" class="big-btn primary">Confirm</button>
    </div>
  </section>

  <!-- ===== Round-by-round table ===== -->
  <section id="history" class="screen hidden">
    <header class="game-header">
      <button type="button" id="history-back-btn" class="small-btn">← Back</button>
      <div class="header-info"><span>Score table</span></div>
      <span class="small-btn-spacer"></span>
    </header>
    <div class="table-wrap">
      <table id="history-table"></table>
    </div>
    <button type="button" id="abandon-btn" class="big-btn muted-btn">End game &amp; start over</button>
  </section>

  <!-- ===== Game over ===== -->
  <section id="gameover" class="screen hidden">
    <div class="dice" id="dice" aria-label="Five dice showing a straight, 1 to 5"></div>
    <h1 id="winner-label"></h1>
    <ol id="final-standings"></ol>
    <button type="button" id="over-table-btn" class="big-btn">Score table</button>
    <button type="button" id="over-undo-btn" class="big-btn">↶ Undo last score</button>
    <button type="button" id="new-game-btn" class="big-btn primary">New game</button>
  </section>

  <!-- ===== Past games ===== -->
  <section id="past" class="screen hidden">
    <header class="game-header">
      <button type="button" id="past-back-btn" class="small-btn">← Back</button>
      <div class="header-info"><span>Past games</span></div>
      <span class="small-btn-spacer"></span>
    </header>
    <ul id="past-list"></ul>
    <button type="button" id="clear-past-btn" class="big-btn muted-btn">Delete all past games</button>
  </section>

  <script src="app.js"></script>
</body>
</html>
