<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Disable pinch/double-tap zoom so stray taps at the table don't zoom the page -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Dice Scorekeeper</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== Setup screen ===== -->
  <section id="setup" class="screen">
    <h1>Dice Scorekeeper</h1>

    <label class="field-label">Players</label>
    <div class="stepper">
      <button type="button" id="players-minus" aria-label="Fewer players">−</button>
      <span id="player-count">2</span>
      <button type="button" id="players-plus" aria-label="More players">+</button>
    </div>

    <div id="name-fields"></div>

    <label class="field-label">Winning score</label>
    <div class="target-options">
      <button type="button" class="target-btn" data-target="5000">5,000</button>
      <button type="button" class="target-btn" data-target="10000">10,000</button>
      <input type="number" id="custom-target" inputmode="numeric" placeholder="Other" min="1">
    </div>

    <button type="button" id="start-btn" class="big-btn primary">Start game</button>
  </section>

  <!-- ===== Game screen ===== -->
  <section id="game" class="screen hidden">
    <header class="game-header">
      <span id="round-label">Round 1</span>
      <span id="target-label">to 10,000</span>
    </header>

    <ul id="scoreboard"></ul>

    <div class="entry">
      <div id="turn-label"></div>
      <div id="pending">0</div>
    </div>

    <div class="quick-add">
      <button type="button" data-add="50">+50</button>
      <button type="button" data-add="100">+100</button>
      <button type="button" data-add="500">+500</button>
      <button type="button" data-add="1000">+1,000</button>
    </div>

    <div class="numpad">
      <button type="button" data-digit="1">1</button>
      <button type="button" data-digit="2">2</button>
      <button type="button" data-digit="3">3</button>
      <button type="button" data-digit="4">4</button>
      <button type="button" data-digit="5">5</button>
      <button type="button" data-digit="6">6</button>
      <button type="button" data-digit="7">7</button>
      <button type="button" data-digit="8">8</button>
      <button type="button" data-digit="9">9</button>
      <button type="button" id="clear-btn" class="muted">Clear</button>
      <button type="button" data-digit="0">0</button>
      <button type="button" id="back-btn" class="muted" aria-label="Backspace">⌫</button>
    </div>

    <div class="actions">
      <button type="button" id="bust-btn" class="big-btn danger">Bust</button>
      <button type="button" id="confirm-btn" class="big-btn primary">Confirm</button>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
